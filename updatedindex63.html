```html
<!DOCTYPE html>
<html>
<head>
<title>Hover Card Animation</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f0f2f5;
    font-family: sans-serif;
  }

  .card {
    width: 280px;
    height: 180px;
    background-color: #ffffff;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 1.6em;
    color: #333;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    transition: transform 0.4s ease-out, box-shadow 0.4s ease-out;
  }

  .card:hover {
    transform: translateY(-15px) scale(1.03);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, #FFD700 0%, #FFA500 100%);
    opacity: 0;
    transition: opacity 0.4s ease-out;
    z-index: 1;
  }

  .card:hover::before {
    opacity: 0.15;
  }

  .card span {
    position: relative;
    z-index: 2;
    transition: color 0.4s ease-out;
  }

  .card:hover span {
    color: #4CAF50; /* Changes text color on hover */
  }
</style>
</head>
<body>
  <div class="card">
    <span>Hover Me!</span>
  </div>
</body>
</html>
