```html
<!DOCTYPE html>
<html>
<head>
<title>Hover Card Animation</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f0f2f5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .card {
    width: 250px;
    height: 150px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
    cursor: pointer;
    color: #333;
  }

  .card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    background-color: #e6f7ff;
  }

  .card h2 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 1.8em;
    color: #007bff;
  }

  .card p {
    margin: 0;
    font-size: 1em;
    color: #555;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Hover Me!</h2>
  <p>I'll lift and glow a bit.</p>
</div>

</body>
</html>
```
